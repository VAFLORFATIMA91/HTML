<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resort Reservation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* BODY WITH FLEX (FIX FOR FOOTER) */
body {
    background: 
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url('beach.jpeg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;

    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* MAIN CONTENT (PUSH FOOTER DOWN) */
.main-content {
    flex: 1;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 60px;
    background: rgba(0,0,0,0.4);
    position: relative;
}

/* Logo image next to text */
.logo {
    display: flex;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
}

.logo-img {
    height: 50px;       /* Adjust height as needed */
    margin-right: 10px; /* Space between image and text */
}

/* CENTERED HOME */
.home {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-weight: normal;
    cursor: pointer;

}

/* NAV BUTTONS AS LINKS */
.nav-buttons a {
    display: inline-block;
    margin-left: 10px;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    text-align: center;
    transition: 0.3s;
}

/* REGISTER BUTTON */
.nav-buttons .register {
    background: transparent;
    border: 1px solid white;
    color: white;
}

.nav-buttons .register:hover {
    background: white;
    color: black;
}

/* SIGN IN BUTTON */
.nav-buttons .login {
    background: #ffb700;
    color: black;
}

.nav-buttons .login:hover {
    background: #e6a600;
}

/* HERO */
.hero {
    text-align: center;
    margin-top: 120px;
    padding: 20px;
}

.hero h1 {
    font-size: 52px;
    font-weight: bold;
}

.hero p {
    margin-top: 15px;
    font-size: 20px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 20px;
    background: rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<div class="main-content">

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            <img src="logo4.jpeg" alt="Resort Logo" class="logo-img">
            <span>Resort Reservation</span>
        </div>


        <div class="nav-buttons">
            <a href="register1.html" class="register">Register</a>
            <a href="sign-in.html" class="login">Sign In</a>
        </div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>Experience Your Perfect Beach Escape 🌊</h1>
        <p>
            Discover relaxation, comfort, and unforgettable memories at our resort. 
            Book your stay today and enjoy a peaceful getaway by the sea.
        </p>
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    <p>© 2026 Resort Reservation System</p>
</div>

</body>
</html>
