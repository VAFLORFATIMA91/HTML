<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Beach Resort Reservation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* BODY */
body {
    background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('beach.jpeg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;

    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* MAIN */
.main-content {
    flex: 1;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 60px;
    background: rgba(0,0,0,0.4);
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.nav-buttons a {
    margin-left: 10px;
    padding: 8px 15px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
}

.login {
    background: #ffb700;
    color: black;
}
/* Logo image next to text */
.logo {
    display: flex;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
}

.logo-img {
    height: 50px;       /* Adjust height as needed */
    margin-right: 10px; /* Space between image and text */
}

/* CENTERED HOME */
.home {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-weight: normal;
    cursor: pointer;
}

.home:hover {
    text-decoration: underline;
}


/* FORM CONTAINER */
.form-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 80px;
}

/* FORM BOX */
.form-box {
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 10px;
    width: 350px;
}

.form-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* INPUTS */
.form-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 5px;
}

/* BUTTON */
.form-box button {
    width: 100%;
    padding: 12px;
    background: #0077cc;
    border: none;
    color: white;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
}

.form-box button:hover {
    background: #005fa3;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 20px;
    background: rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<div class="main-content">

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            <img src="logo4.jpeg" alt="Resort Logo" class="logo-img">
            <span>Resort Reservation</span>
        </div>

	
        <div class="nav-buttons">
            <a href="sign-in.html" class="login">Sign In</a>
        </div>
    </div>

    <!-- FORM -->
    <div class="form-container">
        <div class="form-box">
            <h2>Create Account</h2>

            <form>
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>

                <button type="submit">Register</button>
            </form>
        </div>
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    <p>© 2026 Resort Reservation System</p>
</div>

</body>
</html>
